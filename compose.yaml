name: negotiable-calendar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-negotiable_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-negotiable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negotiable_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-negotiable}:${POSTGRES_PASSWORD:-negotiable_local}@postgres:5432/${POSTGRES_DB:-negotiable_calendar}?sslmode=disable
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      DEMO_MODE: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
