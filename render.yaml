services:
  - type: web
    name: negotiable-calendar-api-furukawa1020
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: negotiable-calendar-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://negotiable-calendar-furukawa1020.onrender.com
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        value: https://negotiable-calendar-api-furukawa1020.onrender.com/api/v1/auth/google/callback
      - key: GOOGLE_CALENDAR_REDIRECT_URL
        value: https://negotiable-calendar-api-furukawa1020.onrender.com/api/v1/calendar/google/callback
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: negotiable-calendar-furukawa1020
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: web
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://negotiable-calendar-api-furukawa1020.onrender.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://negotiable-calendar-api-furukawa1020.onrender.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: negotiable-calendar-db
    plan: free
    region: singapore
    databaseName: negotiable_calendar
    user: negotiable_calendar
