services:
  - type: web
    name: negotiable-calendar-api-furukawa1020
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: negotiable-calendar-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://negotiable-calendar-furukawa1020.onrender.com
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        value: https://negotiable-calendar-api-furukawa1020.onrender.com/api/v1/auth/google/callback
      - key: GOOGLE_CALENDAR_REDIRECT_URL
        value: https://negotiable-calendar-api-furukawa1020.onrender.com/api/v1/calendar/google/callback
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: negotiable-calendar-furukawa1020
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: web
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://negotiable-calendar-api-furukawa1020.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: negotiable-calendar-db
    plan: free
    region: singapore
    databaseName: negotiable_calendar
    user: negotiable_calendar
