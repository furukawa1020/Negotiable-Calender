name: Calendar sync watchdog

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: calendar-sync-watchdog
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && vars.CALENDAR_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check recent timer-triggered success without running sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-sync-watchdog.py >> "$GITHUB_STEP_SUMMARY"
