name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  deployment:
    name: Production blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production invariants
        shell: bash
        run: |
          grep -q 'healthCheckPath: /healthz' render.yaml
          grep -q 'value: "false"' render.yaml
          grep -q 'value: "true"' render.yaml
          grep -q 'GOOGLE_CLIENT_SECRET' render.yaml
          grep -q 'sync: false' render.yaml
          grep -q 'generateValue: true' render.yaml
          ! grep -Eq 'GOOGLE_CLIENT_SECRET:[[:space:]]+[^$]' render.yaml
